<header class="flex flex-wrap items-center gap-x-6 gap-y-3 bg-slate-900 px-6 py-3.5 text-white">
  <div class="flex items-center gap-3">
    <span class="text-2xl text-emerald-500" aria-hidden="true">◆</span>
    <div>
      <h1 class="text-lg font-bold">Portfolio<span class="text-emerald-500">Pro</span></h1>
      <p class="text-xs text-white/60">Investment dashboard</p>
    </div>
  </div>

  <div class="ml-auto text-right leading-tight">
    <span class="block text-[0.7rem] uppercase tracking-wider text-white/60">Total value</span>
    <strong class="text-xl tabular-nums">{{ summary().totalValue | currency }}</strong>
  </div>

  <a
    routerLink="/profile"
    class="flex items-center gap-2.5 rounded-full border border-white/15 bg-white/5 px-2 py-1.5 pr-4 no-underline transition-colors hover:bg-white/10"
  >
    <span
      class="flex h-8 w-8 items-center justify-center rounded-full bg-emerald-600 text-sm font-bold uppercase text-white"
    >
      {{ initials() }}
    </span>
    <span class="text-sm font-semibold text-white">{{ profile().fullName }}</span>
  </a>
</header>

<nav class="flex gap-1 border-b border-slate-200 bg-white px-6" aria-label="Primary">
  <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">
    Dashboard
  </a>
  <a routerLink="/holdings" routerLinkActive="active" class="nav-link">Holdings</a>
  <a routerLink="/transactions" routerLinkActive="active" class="nav-link">Transactions</a>
  <a routerLink="/profile" routerLinkActive="active" class="nav-link">Profile</a>
</nav>

<main class="mx-auto max-w-5xl px-6 pb-12 pt-7">
  <router-outlet />
</main>
